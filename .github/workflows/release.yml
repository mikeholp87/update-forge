name: Release

# Runs only for version tags. Creating a tag and publishing is a manual, authorized maintainer action.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    environment: release        # configure required reviewers on this environment to protect releases
    permissions:
      contents: write           # only this job may create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project tests/UpdateForge.Core.Tests -c Release
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/publish.ps1 -Version $v
          dotnet build src/UpdateForge.Installer/UpdateForge.Installer.wixproj -c Release -p:Version=$v
          Get-ChildItem src/UpdateForge.Installer/bin -Recurse -Filter *.msi | Copy-Item -Destination artifacts
          Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip','.msi' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Add-Content artifacts/SHA256SUMS.txt }
      # Authenticode signing is applied here only when a certificate is configured as a secret; keys never live in the repo.
      - name: Create GitHub release (draft)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' artifacts/*.zip artifacts/*.msi artifacts/SHA256SUMS.txt --draft --title '${{ github.ref_name }}' --notes-file CHANGELOG.md
