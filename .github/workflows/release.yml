name: Release

# Runs only for version tags. Creating a tag and publishing is a manual, authorized maintainer action.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    environment: release        # configure required reviewers on this environment to protect releases
    permissions:
      contents: write           # only this job may create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project tests/UpdateForge.Core.Tests -c Release
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/publish.ps1 -Version $v
          dotnet build src/UpdateForge.Installer/UpdateForge.Installer.wixproj -c Release -p:Version=$v
          Get-ChildItem src/UpdateForge.Installer/bin -Recurse -Filter *.msi | Copy-Item -Destination artifacts
          Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip','.msi' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Add-Content artifacts/SHA256SUMS.txt }
      # Authenticode signing is applied here only when a certificate is configured as a secret; keys never live in the repo.
      - name: Create GitHub release (draft)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' artifacts/*.zip artifacts/*.msi artifacts/SHA256SUMS.txt --draft --title '${{ github.ref_name }}' --notes-file CHANGELOG.md

  # Builds the .deb on the oldest supported Ubuntu and attaches it to the draft created above.
  # The central apt repository (mikeholp87/apt) picks it up once the draft is published.
  linux-deb:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write           # upload to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Tag must match the project version
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
      - name: Build the .deb
        run: ./scripts/publish-linux.sh "${GITHUB_REF_NAME#v}" linux-x64
      - name: Installs, verifies and removes cleanly
        run: |
          sudo apt-get install -y ./artifacts/updateforge_*_amd64.deb
          sudo dpkg --verify updateforge
          updateforge-cli --help >/dev/null
          sudo apt-get remove -y updateforge
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/updateforge_*_amd64.deb artifacts/UpdateForge-*-portable.tar.gz artifacts/SHA256SUMS-linux
