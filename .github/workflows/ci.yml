name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit SHAs (verified commit objects); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore UpdateForge.sln
      - name: Build (warnings are errors; includes static analysis)
        run: dotnet build UpdateForge.sln -c Release --no-restore
      - name: Test
        run: dotnet test --project tests/UpdateForge.Core.Tests -c Release --no-build
      - name: Dependency vulnerability scan
        shell: pwsh
        run: |
          $out = dotnet list UpdateForge.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable dependencies found' }

  package:
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish portable build
        shell: pwsh
        run: ./scripts/publish.ps1 -Version 0.1.0
      - name: Build MSI
        run: dotnet build src/UpdateForge.Installer/UpdateForge.Installer.wixproj -c Release -p:Version=0.1.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updateforge-0.1.0
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            src/UpdateForge.Installer/bin/**/*.msi
